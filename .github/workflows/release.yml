name: Release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "发布版本号（如 v3.0.41）。留空则按 versionCode 自动生成 v3.0.N"
        required: false
        type: string

jobs:
  build-manager:
    uses: ./.github/workflows/build-manager.yml
    secrets: inherit

  release:
    needs:
      - build-manager
    # 上游只要还留下了 APK 就发，不因为某个可选平台（比如 macOS 的 ksud）
    # 排队超时被取消而把整次发布一起带下去。
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          merge-multiple: false

      # download-artifact 会按 artifact 名建子目录，其中有两个都叫同一个 APK 名：
      #   manager/        ← repack 过、注入了 ksud、按内核身份重签（21MB）
      #   manager-gradle/ ← gradle 原始产物，没有内嵌 ksud（12MB）
      # 把两者摊平到同一层会互相覆盖，覆盖结果取决于 find 的遍历顺序——
      # 上一版就这么随机拿到了 12MB 那个，发布出去的管理器里没有 libksud.so，
      # 所有需要 ksud 的功能（模块安装、KPM、susfs 应用）全部失效。
      # 所以这里只认 manager/，别的目录一律不碰。
      - name: Collect apk
        run: |
          mkdir -p manager
          if ! ls manager/*.apk >/dev/null 2>&1; then
            echo "::warning::没有找到 repack 后的 manager artifact，回退到 gradle 原始包（不含内嵌 ksud）"
            find . -maxdepth 3 -type f -name "*.apk" -not -path "./manager/*" -exec cp -f {} manager/ \;
          fi
          ls -l manager/

      - name: Verify apk exists
        run: |
          if ! ls manager/*.apk >/dev/null 2>&1; then
            echo "::error::没有拿到管理器 APK，放弃发布（检查 build-manager 是否成功）"
            exit 1
          fi

      # 发布前的硬校验：管理器必须内嵌 ksud。
      # 缺了它，安装模块、KPM 加载、susfs 应用这些全都会失败，
      # 而 APK 照样能装上、界面照样能开——这种残包不拦住，发出去就是事故。
      - name: Verify apk bundles ksud
        run: |
          APK=$(ls manager/*.apk | head -n 1)
          if ! unzip -l "$APK" | grep -q "lib/arm64-v8a/libksud.so"; then
            echo "::error::$APK 里没有 lib/arm64-v8a/libksud.so，这是 gradle 原始包而不是 repack 产物，不能发布"
            exit 1
          fi
          echo "✓ $(unzip -l "$APK" | grep 'lib/arm64-v8a/libksud.so' | awk '{print $1}') 字节的 ksud 已内嵌"

      - name: Resolve tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          elif [ -f VERSION ]; then
            # 版本号只认 VERSION 文件，和 commit 数 / 克隆深度无关。
            # 之前用 APK 名里的 versionCode 反推，本地浅克隆是 43 个提交、
            # CI 是 2977 个，同一个 commit 反推出两个不同的版本号。
            TAG="v$(tr -d '[:space:]' < VERSION)"
          else
            echo "::error::仓库根没有 VERSION 文件，请在触发时手动填写 tag"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "发布版本号：$TAG"

      - name: Rename ksud
        run: |
          mkdir -p ksud
          for dir in ./ksud-*; do
            if [ -d "$dir" ]; then
                echo "----- Rename $dir -----"
                ksud_platform_name=$(basename "$dir")
                if [ -f "$dir/ksud" ]; then
                  mv "$dir/ksud" "ksud/$ksud_platform_name"
                elif [ -f "$dir/ksud.exe" ]; then
                  mv "$dir/ksud.exe" "ksud/$ksud_platform_name.exe"
                fi
            fi
          done

      - name: Rename ksuinit
        run: |
          mkdir -p ksuinit
          for dir in ./ksuinit-*; do
            if [ -d "$dir" ]; then
                echo "----- Rename $dir -----"
                ksuinit_platform_name=$(basename "$dir")
                if [ -f "$dir/ksuinit" ]; then
                  mv "$dir/ksuinit" "ksuinit/$ksuinit_platform_name"
                fi
            fi
          done

      - name: Rename lkm
        run: |
          mkdir -p lkm
          for dir in ./*android*-lkm*; do
            if [ -d "$dir" ]; then
                echo "----- Rename $dir -----"
                lkm_platform_name=$(basename "$dir")
                lkm_platform_name="lkm-${lkm_platform_name%-lkm}_kernelsu.ko"
                KO="$(ls $dir/*_kernelsu.ko 2>/dev/null | head -n 1)"
                if [ -n "$KO" ]; then
                  mv "$KO" "lkm/$lkm_platform_name"
                fi
            fi
          done

      - name: Display structure of downloaded files
        run: ls -R

      - name: release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: false
          files: |
            manager/*.apk
            lkm/lkm-*_kernelsu.ko
            ksud/ksud-*
            ksuinit/*
